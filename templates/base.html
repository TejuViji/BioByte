<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Biobyte: A Biology Centered Learning Platform </title>
    <meta name = "description" content = "Biobyte is a biology centered interactive learning platform designed to help students learn biology in a fun way through articles, quizzes and interactive content, all on a fun, pixel-art theme.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
      /* Internal CSS goes here */
      body {
        background-color: #EAE8BA; /* Game Boy beige */
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Press Start 2P', monospace;
        color: #000000;
      }
    </style>
    {% block head %} {% endblock %}
</head>

<body>
    <nav name="main-nav" class="nav-bar">
        <li>
            <h2 class = "logo"> <a href="{{url_for('landing_page')}}"> Biobyte </a></h2>
            <h3 class = "nav-text"><a href="{{url_for('plant_page')}}">Plant Articles</a></h3>
            <h3 class = "nav-text"><a href="{{url_for('cell_page')}}">Cell Articles</a></h3>
            <h3 class = "nav-text"><a href="{{url_for('zoology_page')}}">Zoology Articles</a></h3>
            {% if session.get('username') %}
                <h3 class = "nav-text"><a href="{{url_for('profile_page')}}">Profile</a></h3>
            {% else %}
                <h3 class = "nav-text"><a href="{{url_for('login_page')}}">Login/Signup</a></h3>
            {% endif %}
        </li>

    </nav>
    {% block main_content %} 
    
    {% endblock %}
</body>
