<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Biobyte: A Biology Centered Learning Platform </title>
    <meta name = "description" content = "Biobyte is a biology centered interactive learning platform designed to help students learn biology in a fun way through articles, quizzes and interactive content, all on a fun, pixel-art theme.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
      body {
        background-color: #EAE8BA; 
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Press Start 2P', monospace;
        color: #000000;
      }
      .submit_button {
        font-family: 'Press Start 2P', monospace;
        color: #000000;
        background-color: #24b521
      }
    </style>
    {% block head %} {% endblock %}
</head>

<body>
    <nav aria-label="Main navigation" class="nav-bar">
        <ul>
            <li class="nav-brand"><a href="{{url_for('landing_page')}}"><span class = "brand_bio">Bio</span>byte</a></li>
            <li class="nav-item"><a href="{{url_for('plant_page')}}">Plant Articles</a></li>
            <li class="nav-item"><a href="{{url_for('cell_page')}}">Cell Articles</a></li>
            <li class="nav-item"><a href="{{url_for('zoology_page')}}">Zoology Articles</a></li>
            {% if session.get('username') %}
                <li class="nav-item"><a href="{{url_for('dashboard_page')}}">Dashboard</a></li>
            {% else %}
                <li class="nav-item"><a href="{{url_for('login_page')}}">Login/Signup</a></li>
            {% endif %}

        </ul>
    </nav>
    {% block main_content %}

    {% endblock %}
</body>
